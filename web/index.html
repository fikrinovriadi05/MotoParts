<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MotoPart - toko sparepart motor lengkap.">
  <meta name="theme-color" content="#1A1A1D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MotoPart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MotoPart</title>
  <link rel="manifest" href="manifest.json">

  <!-- Layar pemuatan: tampil selama aplikasi diunduh (beberapa detik pada
       kunjungan pertama), lalu otomatis tertutup oleh aplikasi Flutter. -->
  <style>
    html, body { margin: 0; height: 100%; background: #1A1A1D; }

    /* Tanpa kedipan/sorotan biru bawaan browser saat tombol ditekan atau
       diketuk (HP) dan tanpa bingkai fokus biru di kanvas. Efek tekan sudah
       ditangani aplikasi sendiri (riak dan perubahan warna). */
    * { -webkit-tap-highlight-color: rgba(0, 0, 0, 0); }
    flutter-view, flt-glass-pane, flt-semantics-host, flt-semantics,
    flt-scene-host, canvas {
      outline: none !important;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
      -webkit-touch-callout: none;
    }
    flt-semantics:focus, flt-semantics *:focus { outline: none !important; }

    /* Klik cepat / klik dua kali tidak boleh "memilih" kanvas: browser akan
       menimpanya dengan lapisan seleksi biru transparan seperti satu layar
       penuh. Teks di kolom isian tetap bisa dipilih (digambar Flutter). */
    flutter-view, flt-glass-pane, flt-scene-host, flt-semantics-host,
    flt-semantics, canvas {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      user-select: none !important;
    }
    flutter-view ::selection, flt-glass-pane ::selection,
    flt-semantics ::selection, canvas::selection {
      background: transparent !important;
    }
    #muat {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      font-family: Arial, Helvetica, sans-serif; color: #fff;
    }
    #muat b { font-size: 30px; letter-spacing: -0.5px; }
    #muat b span { color: #FF6B00; }
    #muat i {
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.18); border-top-color: #FF6B00;
      animation: putar 0.9s linear infinite;
    }
    #muat small { color: rgba(255, 255, 255, 0.55); }
    @keyframes putar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="muat">
    <b>Moto<span>Part</span></b>
    <i></i>
    <small>Memuat aplikasi...</small>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
